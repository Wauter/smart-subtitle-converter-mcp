<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 280" width="940" height="280" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How Smart Subtitle Converter fits together</title>
  <desc id="d">An AI client or agent talks to the Smart Subtitle Converter MCP, which calls the Smart Subtitle Converter API over HTTP and JSON. Your own platform can call the API directly. The API uses libse, Subtitle Edit's engine, and reads and writes folders, S3-compatible buckets and HTTPS or presigned URLs.</desc>
