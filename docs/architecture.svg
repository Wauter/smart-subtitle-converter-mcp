      <text x="125" y="63">AI client or agent</text>
      <text x="365" y="63">MCP server</text>
      <text x="125" y="207">Your platform</text>
      <text x="590" y="130">Smart Subtitle</text>
      <text x="590" y="150">Converter API</text>
      <text x="815" y="63">libse</text>
      <text x="815" y="207">Storage</text>
    </g>
    <g font-size="12" fill="#57606a">
