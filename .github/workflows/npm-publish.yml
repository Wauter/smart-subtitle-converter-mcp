name: npm-publish

# Publish the npm package from the selected ref (default: main).
# Needs secrets.NPM_TOKEN (classic automation token with publish rights) or npm trusted
# publishing configured for this repo. Does not move tags or rebuild the image.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish (tag or SHA)
        required: true
        default: main

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Ref contains the renamed package
        run: test "$(node -p 'require("./package.json").name')" = smart-subtitle-converter-mcp
      - run: npm ci && npm run build
      - name: npm publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
