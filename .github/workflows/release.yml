name: release

# Version tags build/test, then publish the image and GitHub Release when enabled.
# npm is deliberately separate: the manual npm-publish.yml workflow stages it for 2FA approval.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  API_IMAGE: ghcr.io/wauter/smart-subtitle-converter-api:1.4   # Paired API major/minor (D-43); no publishing triggered by this change.

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version (D-43)
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Contract (must pass for a release)
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_READ_TOKEN:-$GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$API_IMAGE"
          scripts/contract.sh "$API_IMAGE"

  publish:
    needs: test
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      # Packages REST API cannot change visibility (404). MCP image created after the repo
      # went public is already pullable anonymously; if that ever regresses, set public at:
      # https://github.com/users/Wauter/packages/container/smart-subtitle-converter-mcp/settings
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release already exists; preserving its notes."
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes --notes "Pairs with API ${GITHUB_REF_NAME#v} (D-43). Image: ${IMAGE}:${GITHUB_REF_NAME#v}"
          fi
