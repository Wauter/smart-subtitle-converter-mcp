name: release

# v*.*.* tags only. Tags build and test; publish (image, GitHub Release, npm) runs when the repo
# variable PUBLISH_ENABLED is true. Image and GitHub Release are created before npm publish so a
# missing NPM_TOKEN still leaves a usable release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/subtitleedit-converter-mcp
  API_IMAGE: ghcr.io/wauter/subtitleedit-converter-api:1.3   # Paired API major/minor (D-43); no publishing triggered by this change.

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version (D-43)
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Contract (must pass for a release)
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_READ_TOKEN:-$GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$API_IMAGE"
          scripts/contract.sh "$API_IMAGE"

  publish:
    needs: test
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Make package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Packages created while the repo was private stay private until visibility is changed.
          name="subtitleedit-converter-mcp"
          gh api --method PATCH "/user/packages/container/${name}" -f visibility=public \
            || gh api --method PATCH "/users/${{ github.repository_owner }}/packages/container/${name}" -f visibility=public
      - run: npm ci && npm run build
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --notes "Pairs with API ${GITHUB_REF_NAME#v} (D-43). Image: ${IMAGE}:${GITHUB_REF_NAME#v}"
      - name: npm publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
