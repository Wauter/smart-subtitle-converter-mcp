name: publish-image

# Image-only rebuilds from an existing ref, without moving tags or publishing npm.
# Old tag workflows hardcode the former image name, so rerunning them is not a rename.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Existing source ref (never moved)
        type: choice
        options: [main, v1.3.0, v1.4.0, v1.4.1]
        default: v1.4.1
        required: true
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-image-${{ inputs.ref || 'main' }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}
      - name: Resolve immutable source and destination tags
        id: source
        env:
          SOURCE_REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA=$(git rev-parse HEAD)
          VERSION=$(node -p 'require("./package.json").version')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$IMAGE:sha-${SHA:0:7}"
            if [ "$SOURCE_REF" = main ]; then
              echo "$IMAGE:edge"
            else
              test "$SOURCE_REF" = "v$VERSION"
              echo "$IMAGE:$VERSION"
              echo "$IMAGE:${VERSION%.*}"
              echo "$IMAGE:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push existing source (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.source.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Smart Subtitle Converter MCP
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            REVISION=${{ steps.source.outputs.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
